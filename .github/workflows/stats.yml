name: Update profile stats

on:
  schedule:
    # Runs daily at 00:17 in UTC+8.
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=coopjz&show_icons=true&include_all_commits=true&count_private=true&theme=transparent"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=coopjz&layout=compact&langs_count=8&hide=C&theme=transparent"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No card changes."
            exit 0
          fi

          git commit -m "profile: update stats cards"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
